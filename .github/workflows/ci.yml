
name: Python CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run automated tests
        run: python -m unittest discover -v


      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan Python code for security issues
        run: bandit -r app.py test_app.py

      - name: Build Docker image
        run: docker build -t devops-python-app .